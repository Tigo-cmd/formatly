[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formatly-engine"
version = "0.1.0"
description = "Check and correct .docx documents against a formatting rulebook."
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.2",
  "pydantic>=2.5",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
formatly = "formatly_engine.cli:main"

[tool.setuptools.packages.find]
include = ["formatly_engine*"]

[tool.setuptools.package-data]
formatly_engine = ["rulebooks/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
