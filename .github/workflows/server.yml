name: server

on:
  push:
    paths: ["server/**", "engine/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "engine/**", ".github/workflows/server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev]" -e "server[dev]"
      - run: pytest -q
        working-directory: server
